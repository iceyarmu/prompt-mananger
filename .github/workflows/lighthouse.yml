name: Lighthouse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          npm install -g @lhci/cli@0.13.x
      
      - name: Build application
        run: npm run build
        env:
          CI: true
      
      - name: Start server
        run: |
          npm run preview &
          sleep 5
        env:
          CI: true
      
      - name: Wait for server
        run: |
          npm install -g wait-on
          wait-on http://localhost:3000 -t 30000
      
      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}
      
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 30
      
      - name: Format results as comment
        if: github.event_name == 'pull_request'
        id: format-results
        run: |
          node scripts/format-lighthouse-results.js > lighthouse-comment.md
          echo "::set-output name=comment-file::lighthouse-comment.md"
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('lighthouse-comment.md', 'utf8');
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('## 🚦 Lighthouse Results')
            );
            
            const body = `## 🚦 Lighthouse Results\n\n${comment}`;
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      
      - name: Fail if performance budgets exceeded
        if: failure()
        run: |
          echo "❌ Performance budgets exceeded!"
          echo "Please review the Lighthouse results and optimize accordingly."
          exit 1

  lighthouse-mobile:
    runs-on: ubuntu-latest
    needs: lighthouse
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          npm install -g @lhci/cli@0.13.x
      
      - name: Build application
        run: npm run build
      
      - name: Start server
        run: |
          npm run preview &
          sleep 5
      
      - name: Create mobile config
        run: |
          cat > lighthouserc-mobile.js << 'EOF'
          module.exports = {
            ci: {
              collect: {
                url: [
                  'http://localhost:3000/',
                  'http://localhost:3000/editor',
                ],
                numberOfRuns: 3,
                settings: {
                  preset: 'mobile',
                  throttling: {
                    cpuSlowdownMultiplier: 4,
                    rttMs: 150,
                    throughputKbps: 1638.4,
                  },
                  screenEmulation: {
                    width: 412,
                    height: 823,
                    deviceScaleFactor: 2.625,
                    mobile: true,
                  },
                },
              },
              assert: {
                assertions: {
                  'categories:performance': ['warn', { minScore: 0.8 }],
                  'first-contentful-paint': ['warn', { maxNumericValue: 3000 }],
                  'largest-contentful-paint': ['warn', { maxNumericValue: 4000 }],
                  'interactive': ['warn', { maxNumericValue: 5000 }],
                },
              },
              upload: {
                target: 'temporary-public-storage',
              },
            },
          };
          EOF
      
      - name: Run Lighthouse CI (Mobile)
        run: lhci autorun --config=lighthouserc-mobile.js
      
      - name: Upload Mobile Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-mobile-results
          path: .lighthouseci
          retention-days: 30